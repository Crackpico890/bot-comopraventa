# ============================================================
#  Configuración del bot de chollos
# ============================================================

budget: 400            # coste máximo de compra (precio + envío + comisiones), en €

# Tu zona (La Pobla de Vallbona). Wallapop busca en toda España; los anuncios
# sin envío solo cuentan si están a menos de local_radius_km.
location:
  lat: 39.5877
  lon: -0.5530
  local_radius_km: 40

# Cada cuánto se revisa cada producto (segundos). Hay pausas aleatorias
# entre peticiones para no saturar las webs y que no nos bloqueen.
scan_interval_s: 300
request_delay_s: [2.5, 6.0]
market_refresh_h: 6      # cada cuánto se rehace el muestreo amplio de precios
market_window_days: 30   # días de historial para calcular el precio de mercado
sold_checks_per_cycle: 40   # anuncios que se comprueban por ciclo para detectar ventas
daily_report_hour: 21    # hora del informe diario de mercado (hora de Madrid)

rules:
  only_chollazos: true        # true = solo avisa de chollazos históricos
  min_samples: 20             # mínimo de anuncios comparables para fiarse del precio
  min_sold_samples: 5         # ventas detectadas para usar el precio real de venta
  max_days_to_sell: 10        # si tarda más en venderse, no interesa
  min_profit_eur: 40
  min_profit_pct: 0.30
  chollazo_profit_eur: 70     # beneficio limpio mínimo de un CHOLLAZO
  chollazo_profit_pct: 0.45
  suspicious_discount: 0.65   # más de un 65 % por debajo del mercado = posible estafa

# Costes. Se pueden ajustar si cambian las tarifas de las plataformas.
fees:
  wallapop:
    buy_fee_pct: 0.06       # protección al comprador con envío (aprox.)
    buy_fee_fixed: 0.5
    shipping: 4.5
  vinted:
    buy_fee_pct: 0.05       # protección al comprador de Vinted
    buy_fee_fixed: 0.7
    shipping: 4.0
  resale:                   # cuando lo revendes tú
    sell_fee_pct: 0.0       # vender en Vinted/Wallapop es gratis para el vendedor
    shipping: 0.0           # el envío lo paga el comprador

# Precio de reventa = percentil 40 de los anuncios (prudente: no contamos con
# vender al precio de los que están caros y no se venden).
resale_percentile: 0.40
historic_percentile: 0.10   # para ser CHOLLAZO tiene que estar en el 10 % más barato

# ============================================================
#  Productos vigilados (reventa rápida y precio de mercado claro)
#  must_include: palabras obligatorias en el título ("a|b" = una u otra)
#  exclude: palabras que descartan el anuncio si están en el título
#  platforms: por defecto los dos
# ============================================================
products:
